<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .bg { fill: #0a0a0c; stroke: #242428; stroke-width: 1.5; }
      .sketch-ink { stroke: #ffffff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .sketch-fill { fill: #ffffff; stroke: #ffffff; stroke-width: 1; stroke-linejoin: round; }
      .sketch-tick { stroke: #ffffff; stroke-width: 1.5; stroke-linecap: round; opacity: 0.85; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #f2f1ec; stroke: #dcdcdc; }
        .sketch-ink { stroke: #111111; }
        .sketch-fill { fill: #111111; stroke: #111111; }
        .sketch-tick { stroke: #111111; }
      }
    </style>
  </defs>

  <!-- Container -->
  <rect class="bg" width="64" height="64" rx="10" />

  <!-- ── 1. RULER (Bottom-Left to Top-Right) ── -->
  <g>
    <!-- Ruler Outline -->
    <path class="sketch-ink" d="M11 43 L43 11 L53 21 L21 53 Z" />
    <!-- Ruler Ticks along top edge -->
    <line class="sketch-tick" x1="17" y1="37" x2="21" y2="41" />
    <line class="sketch-tick" x1="23" y1="31" x2="28" y2="36" />
    <line class="sketch-tick" x1="29" y1="25" x2="33" y2="29" />
    <line class="sketch-tick" x1="35" y1="19" x2="40" y2="24" />
    <line class="sketch-tick" x1="41" y1="13" x2="45" y2="17" />
  </g>

  <!-- ── 2. PENCIL (Top-Left to Bottom-Right) ── -->
  <g>
    <!-- Pencil Body (Dual Parallel Shaft Lines) -->
    <line class="sketch-ink" x1="13" y1="18" x2="42" y2="47" />
    <line class="sketch-ink" x1="18" y1="13" x2="47" y2="42" />

    <!-- Eraser Band / Cap at top-left -->
    <path class="sketch-ink" d="M13 18 L18 13 L14 9 L9 14 Z" />
    <line class="sketch-ink" x1="11.5" y1="16.5" x2="16.5" y2="11.5" />

    <!-- Pencil Point & Tip at bottom-right -->
    <path class="sketch-ink" d="M42 47 L51 51 L47 42" />
    <!-- Filled Lead Tip -->
    <polygon class="sketch-fill" points="47,49.5 51,51 49.5,47" />
  </g>
</svg>